<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Amr Walid logo">
  <!-- Concept: the letters "A" + "W" drawn as ONE continuous data line-chart.
       The A's down-stroke doubles as the W's first stroke; every vertex is a
       data node, and the last node is the "live" point — data pipelines,
       analytics and systems in a single mark. -->
  <defs>
    <linearGradient id="awBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#121a3d"/>
    </linearGradient>
    <linearGradient id="awLine" x1="8" y1="40" x2="56" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b8fff"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="awGlow" cx="54" cy="15" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="awClip"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#awBg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#59b0ff" stroke-opacity=".28" stroke-width="1.5"/>
  <path d="M8 52H56" stroke="#59b0ff" stroke-opacity=".18" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="54" cy="15" r="14" fill="url(#awGlow)" clip-path="url(#awClip)"/>
  <!-- A crossbar -->
  <path d="M13.6 37h8.8" stroke="url(#awLine)" stroke-width="3.4" stroke-linecap="round"/>
  <!-- A + W as one polyline -->
  <path d="M9 47 18 16 27 47 36 26 45 47 54 15" fill="none" stroke="url(#awLine)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data nodes -->
  <g fill="#0b1530" stroke-width="2.2">
    <circle cx="18" cy="16" r="2.6" stroke="#3b8fff"/>
    <circle cx="27" cy="47" r="2.6" stroke="#38bdf8"/>
    <circle cx="36" cy="26" r="2.6" stroke="#38bdf8"/>
    <circle cx="45" cy="47" r="2.6" stroke="#7aa8ff"/>
  </g>
  <circle cx="54" cy="15" r="3.6" fill="#ffffff"/>
  <circle cx="54" cy="15" r="1.6" fill="#a78bfa"/>
</svg>
